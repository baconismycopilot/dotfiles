# Window-level chords on macOS: cmd + key, the keys the WezTerm config binds
# to SUPER. Included by keybindings.conf. kitty's macOS defaults stay, except
# the three marked "overrides".

# Splits, side by side and stacked
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# New tab (also a kitty default)
map cmd+t new_tab

# Close the window, asking first. Overrides the kitty default cmd+w close_tab;
# shift+cmd+w close_os_window is untouched.
map cmd+w close_window_with_confirmation

# Previous / next tab; the kitty defaults shift+cmd+[ and shift+cmd+] stay
map cmd+[ previous_tab
map cmd+] next_tab

# Fullscreen. Overrides the kitty default cmd+enter new_window;
# ctrl+shift+enter still opens a window.
map cmd+enter toggle_fullscreen

# Clear scrollback and screen, then redraw the prompt. Overrides the kitty
# default cmd+k clear_terminal to_cursor.
map cmd+k combine : clear_terminal scrollback active : send_key ctrl+l

# 90% opacity and back (needs dynamic_background_opacity in colors.conf).
# WezTerm toggles on one key; kitty sets a value, so this is a pair.
map cmd+u set_background_opacity 0.9
map cmd+shift+u set_background_opacity default
