# Mouse. https://sw.kovidgoyal.net/kitty/conf/#mouse
#
# Mouse actions (mouse_map) are left at the documented defaults: click opens a
# URL, ctrl+shift+right-click shows command output in a pager, shift lets you
# select while a program has grabbed the mouse.

# Underline style for detected URLs: none, straight, double, curly, dotted,
# dashed (default: curly)
url_style curly

# When OSC 8 hyperlinks are underlined: hover, always or never (default: hover)
underline_hyperlinks hover

# Strip trailing spaces when copying: never, smart (normal selections only) or
# always (default: never)
strip_trailing_spaces smart

# Copy on select is off (default: no); ctrl+shift+c copies.
copy_on_select no
