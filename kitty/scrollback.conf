# Scrollback. https://sw.kovidgoyal.net/kitty/conf/#scrollback

# Lines kept for scrolling (default: 2000). Same as the WezTerm config.
scrollback_lines 20000

# Pager for ctrl+shift+h, kept at the default:
#   less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Separate history, in MB, used only when browsing the scrollback in the
# pager; roughly 10000 lines per MB (default: 0, disabled).
scrollback_pager_history_size 10
