# Color scheme. https://sw.kovidgoyal.net/kitty/conf/#color-scheme
#
# Generated with  kitten themes --dump-theme "One Dark"  (kitty 0.49.2) and
# committed so every host gets the same colours; the themes kitten's own
# current-theme.conf is git-ignored. To switch, run
#   kitten themes --config-file-name colors.conf
# or dump another theme over this file and keep the opacity lines below.
#
