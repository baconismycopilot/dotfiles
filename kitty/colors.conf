# Color scheme. https://sw.kovidgoyal.net/kitty/conf/#color-scheme
#
# Generated with  kitten themes --dump-theme "Dark Pastel"  (kitty 0.49.2) and
# committed as the default every host starts from. Dark Pastel is from the
# kitty-themes collection (GPL-3.0, https://github.com/kovidgoyal/kitty-themes).
#
# To use another theme on one host, do not edit this file. Run
#   kitten themes --config-file-name local.conf
# (ctrl+a then c inside kitty) and pick one. The kitten copies it to the
# git-ignored current-theme.conf and includes it from the git-ignored
# local.conf, which kitty.conf loads last, so the per-host pick wins over the
# colours below. Dump another theme over this file only to change the default
# for every host, and keep the opacity lines at the bottom.

# Colors

foreground #ffffff
background #000000
cursor #bbbbbb
selection_foreground #000000
selection_background #b5d5ff

color0 #000000
color1 #ff5555
color2 #55ff55
color3 #ffff55
color4 #5555ff
color5 #ff55ff
color6 #55ffff
color7 #bbbbbb
color8 #545454
color9 #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff

# Tab Bar

active_tab_foreground   #444444
active_tab_background   #b5d5ff
inactive_tab_foreground #ffffff
inactive_tab_background #000000


# Background opacity, 0 transparent to 1 opaque (default: 1.0)
background_opacity 1.0

# Allow changing the opacity at runtime, needed by the cmd/alt+u maps in
# keybindings-<os>.conf; the docs note a performance cost (default: no)
dynamic_background_opacity yes
