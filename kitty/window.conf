# Window layout. https://sw.kovidgoyal.net/kitty/conf/#window-layout
# A kitty "window" is what WezTerm calls a pane.

# Enabled layouts; the first listed is the default (default: *, all).
# splits first: the leader maps use launch --location=vsplit|hsplit, which
# only the splits layout honours. ctrl+shift+l cycles through the rest.
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

# Blank area between text and border, in pts, as top right bottom left
# (default: 0). Roughly the 1.5 / 2 cell gutters of the WezTerm config.
window_padding_width 0 12 0 16

# Ask before closing an OS window or tab holding at least this many windows;
# negative means windows sitting at a shell prompt are not counted, which
# needs shell integration (default: -1).
confirm_os_window_close -1

# Reuse the last OS window size (default: yes)
remember_window_size yes
