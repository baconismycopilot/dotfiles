# Tab bar. https://sw.kovidgoyal.net/kitty/conf/#tab-bar

# top, bottom, left or right (default: bottom), same as the WezTerm config
tab_bar_edge bottom

# Tabs needed before the bar shows (default: 2). Always shown, like WezTerm.
tab_bar_min_tabs 1

# fade, slant, separator, powerline, custom or hidden (default: fade)
tab_bar_style powerline

# Powerline separator: angled, slanted or round (default: angled)
tab_powerline_style slanted

# tab_title_template is left at the default:
#   "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"
# Variables include title, index, layout_name, num_windows, tab.active_wd and
# tab.active_exe; see the docs for the full list.
