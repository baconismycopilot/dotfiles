# Advanced. https://sw.kovidgoyal.net/kitty/conf/#advanced

# Shell integration for zsh, fish and bash: prompt jumping (ctrl+shift+z/x),
# last command output in a pager (ctrl+shift+g), click to move the cursor at
# the prompt, cwd and title reporting. Disable single features with a list of
# no-rc no-cursor no-title no-cwd no-prompt-mark no-complete no-sudo
# (default: enabled)
shell_integration enabled

# Process OSC 8 hyperlinks; ask prompts before opening (default: yes)
allow_hyperlinks yes

# Remote control via `kitten @`: no, yes, socket, socket-only or password
# (default: no). Left off; for a one-off script start a window with
#   launch --allow-remote-control
# which may then control kitty without this option.
allow_remote_control no

# Hours between update checks; 0 disables (default: 24). Homebrew and pacman
# own updates here.
update_check_interval 0

# Desktop notification when a long command finishes (needs shell integration):
# never, unfocused, invisible or always, then the minimum duration in seconds
# (default: never, 5 s)
notify_on_cmd_finish unfocused 10.0

# clipboard_control is left at the default
#   write-clipboard write-primary read-clipboard-ask read-primary-ask
# The docs call removing the read confirmation a security risk, since any
# program, even over SSH, could then read the clipboard.
