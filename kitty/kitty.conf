# kitty entry point, symlinked to $XDG_CONFIG_HOME/kitty/kitty.conf by
# install.sh. Each component lives in its own file, in the order of the
# sections of https://sw.kovidgoyal.net/kitty/conf/. Later lines override
# earlier ones, so the OS file and the per-host file come last.
#
# Relative include paths resolve next to this file (next to the symlink, not
# the repo), environment variables are expanded, and kitty sets KITTY_OS to
# linux, macos or bsd while reading the config.
#
# Reload: ctrl+shift+f5. Show the effective config: ctrl+shift+f6.

include fonts.conf
include cursor.conf
include scrollback.conf
include mouse.conf
include bell.conf
include window.conf
include tabs.conf
include colors.conf
include advanced.conf
include keybindings.conf

# OS specific tweaks (macos.conf or linux.conf; nothing shipped for bsd).
include ${KITTY_OS}.conf

# Per-host overrides, git-ignored, the kitty counterpart of ~/.zshrc.local.
# globinclude rather than include so a missing file is silent.
globinclude local.conf
