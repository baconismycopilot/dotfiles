# OS specific tweaks, Linux. https://sw.kovidgoyal.net/kitty/conf/#os-specific-tweaks
# Included last by kitty.conf when KITTY_OS is linux, so it may override
# earlier files.

# Linux renders the same pt size larger than macOS (fonts.conf sets 13.0)
font_size 10.5

# auto, x11 or wayland (default: auto)
linux_display_server auto
