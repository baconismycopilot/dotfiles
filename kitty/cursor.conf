# Text cursor customization. https://sw.kovidgoyal.net/kitty/conf/#text-cursor-customization
#
# Defaults, stated so the component is visible. Shell integration changes the
# cursor to a beam while editing a command at the prompt; set
# shell_integration no-cursor in advanced.conf to keep the block.

# block, beam or underline (default: block)
cursor_shape block

# Shape when the window is unfocused (default: hollow)
cursor_shape_unfocused hollow

# Blink interval in seconds; 0 disables, negative uses the system default
# (default: -1)
cursor_blink_interval -1
