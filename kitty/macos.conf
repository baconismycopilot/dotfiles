# OS specific tweaks, macOS. https://sw.kovidgoyal.net/kitty/conf/#os-specific-tweaks
# Included last by kitty.conf when KITTY_OS is macos.

# Use Option as Alt: no, left, right or both (default: no). Left Option is
# Alt for shell and editor bindings, right Option still composes characters,
# the same split as the WezTerm config. Needs a restart, not a reload.
macos_option_as_alt left

# Keep running with no windows open, as macOS apps do (default: no)
macos_quit_when_last_window_closed no
