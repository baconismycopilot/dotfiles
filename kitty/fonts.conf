# Fonts. https://sw.kovidgoyal.net/kitty/conf/#fonts
#
# kitty bundles no fonts (WezTerm does), so the family below must be
# installed; install.sh installs Hack Nerd Font when kitty is present and the
# font is missing. Pick another interactively with
#   kitten choose-fonts --config-file-name fonts.conf
# which writes the font_family lines into this file.

# Font family (default: monospace). A patched Nerd Font, so the Powerlevel10k
# glyphs are in the main face. If this is ever swapped for an unpatched font,
# add e.g.  symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Font size in pts (default: 11.0). macOS renders the same pt size smaller;
# linux.conf overrides this to 10.5, the same split the WezTerm config uses.
font_size 13.0

# Ligatures: never, cursor or always (default: never). Kept at the default;
# keybindings.conf maps disable_ligatures_in to switch per window.
disable_ligatures never
