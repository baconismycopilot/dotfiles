# Window-level chords on Linux: alt + key, the keys the WezTerm config binds
# to ALT. Included by keybindings.conf. These alt chords are taken by kitty
# before the shell or editor sees them: d t w [ ] enter k u (with shift: d u).

# Splits, side by side and stacked
map alt+d launch --location=vsplit --cwd=current
map alt+shift+d launch --location=hsplit --cwd=current

# New tab
map alt+t new_tab

# Close the window, asking first
map alt+w close_window_with_confirmation

# Previous / next tab
map alt+[ previous_tab
map alt+] next_tab

# Fullscreen
map alt+enter toggle_fullscreen

# Clear scrollback and screen, then redraw the prompt
map alt+k combine : clear_terminal scrollback active : send_key ctrl+l

# 90% opacity and back (needs dynamic_background_opacity in colors.conf).
# WezTerm toggles on one key; kitty sets a value, so this is a pair.
map alt+u set_background_opacity 0.9
map alt+shift+u set_background_opacity default
