# Terminal bell. https://sw.kovidgoyal.net/kitty/conf/#terminal-bell
# Flash instead of beep, like the WezTerm config.

# Audible bell (default: yes)
enable_audio_bell no

# Visual bell length in seconds, animated fade in and out (default: 0.0, off)
visual_bell_duration 0.15

# Request window attention on bell: dock bounce on macOS, taskbar flash on
# Linux (default: yes)
window_alert_on_bell yes
