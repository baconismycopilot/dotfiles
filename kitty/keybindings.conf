# Keyboard shortcuts. https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts
# Mapping syntax, sequences and modes: https://sw.kovidgoyal.net/kitty/mapping/
#
# Every kitty default shortcut stays active (clear_all_shortcuts no). On top:
#   - the same tmux-style leader as the WezTerm config, ctrl+a then a key,
#     written as kitty multi-key shortcuts (map key1>key2 action);
#   - window-level chords on cmd (macOS) or alt (Linux), in
#     keybindings-<os>.conf, included at the end.
# Comments must be on their own line; kitty treats a trailing # as text.
#
# Defaults worth knowing (kitty_mod is ctrl+shift):
#   kitty_mod+f3  command palette      kitty_mod+f5  reload config
#   kitty_mod+f6  effective config     kitty_mod+f2  edit config
#   kitty_mod+e   open URL by hint     kitty_mod+h   scrollback in pager
#   kitty_mod+g   last command output  kitty_mod+z/x previous/next prompt
#   kitty_mod+l   next layout          kitty_mod+r   resize window
#   kitty_mod+u   unicode input        kitty_mod+escape  kitty shell

# Modifier used by all default shortcuts (default: ctrl+shift)
kitty_mod ctrl+shift

# Remove all shortcut definitions up to this point (default: no)
clear_all_shortcuts no

# Seconds to wait for the next key of a sequence; 0 waits forever
# (default: 0.0). Two seconds, the same as the WezTerm leader.
map_timeout 2.0

# Leader: ctrl+a then a key. Splits need the splits layout, listed first in
# window.conf. vsplit puts the windows side by side, hsplit one above the other.
map ctrl+a>| launch --location=vsplit --cwd=current
map ctrl+a>- launch --location=hsplit --cwd=current

# Move between windows
map ctrl+a>h neighboring_window left
map ctrl+a>j neighboring_window down
map ctrl+a>k neighboring_window up
map ctrl+a>l neighboring_window right

# Zoom: switch to the stack layout, press again to come back
map ctrl+a>z toggle_layout stack

# Send a literal ctrl+a to the shell (press ctrl+a twice)
map ctrl+a>ctrl+a send_key ctrl+a

# The command palette lists every action with its binding; the nearest
# equivalent of the WezTerm keymap menu
map ctrl+a>? command_palette

# ctrl+backspace deletes the previous word, like ctrl+w
map ctrl+backspace send_key ctrl+w

# Swallow F13 (where Print Screen was on some keyboards)
map f13 discard_event

# Ligatures per window. kitty has no toggle action, and ctrl+shift+l is the
# default next_layout, so this pair sits on kitty_mod+alt+l.
map kitty_mod+alt+l disable_ligatures_in active always
map kitty_mod+alt+shift+l disable_ligatures_in active never

# cmd (macOS) or alt (Linux) chords
include keybindings-${KITTY_OS}.conf
